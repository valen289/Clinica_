<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGSM - Encuesta de Satisfacción</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/componentes.css">
    <link rel="stylesheet" href="../assets/css/paginas.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">

 </head>
<body>
   <h1>Encuesta de Satisfacción</h1>

<p>
    Queremos conocer tu experiencia en nuestro hospital.
</p>

<form>
<label for="correo">Correo electrónico:</label>

<input 
    type="email" 
    id="correo" 
    name="correo"
    placeholder="ejemplo@gmail.com"
>
 <label>¿Cómo calificarías el servicio recibido?</label>

  <input type="radio" name="calificacion" value="excelente"> Excelente
  <input type="radio" name="calificacion" value="bueno"> Bueno    
  <input type="radio" name="calificacion" value="regular"> Regular
  <input type="radio" name="calificacion" value="malo"> Malo

  <label>Deberiamos cambiar algo de nuestro servicio?</label>

  <input type="radio" name="opinion" value="Excelente"> No, todo estuvo excelente
  <input type="radio" name="opinion" value="bueno"> Si, pero no es algo grave   
  <input type="radio" name="opinion" value="regular"> Horrible, no me gusto para nada
  <input type="radio" name="opinion" value="malo"> Deberian cambiar todo

  <button type="submit">Enviar encuesta</button>
</form>

    
 </body>

</html>
