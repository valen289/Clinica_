<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Mapas y Ambulancias</title>

  <!-- 1. Estilos CSS de Leaflet (Obligatorio para renderizar el mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- 2. Tu hoja de estilos -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="grid-container">
    <!-- Columna 1fr: Formulario y Controles -->
    <div class="panel-control">
      <h2>  GPS </h2>

      <div class="grupo-campo">
        <label for="departamento">Departamento</label>
        <input type="text" id="departamento" placeholder="Ej: Montevideo" value="Montevideo">
      </div>

      <div class="grupo-campo">
        <label for="dir">Dirección</label>
        <input type="text" id="dir" placeholder="Ej: Av. 18 de Julio 1234">
      </div>

      <button id="ubicar" class="btn btn-primario">Ubicar en Mapa</button>

      <hr class="separador">

      <div class="grupo-campo">
        <label for="lat">Latitud</label>
        <input type="text" id="lat" readonly placeholder="Latitud seleccionada">
      </div>

      <div class="grupo-campo">
        <label for="lng">Longitud</label>
        <input type="text" id="lng" readonly placeholder="Longitud seleccionada">
      </div>

      <button id="ingresarO" class="btn btn-secundario">Ingresar Origen</button>
    </div>

    <!-- Columna 2fr: Mapa Leaflet -->
    <div id="visualizar"></div>
  </div>

  <!-- 3. Librería JavaScript de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 4. Tu lógica de JavaScript -->
  <script src="mapaJS.js"></script>

</body>
</html>
